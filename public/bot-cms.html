<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard - Lunexa Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .glass-panel { background: rgba(22, 27, 34, 0.7); border: 1px solid #30363d; backdrop-filter: blur(10px); }
        .cyber-btn { background: linear-gradient(135deg, #238636, #2ea043); color: white; border-radius: 6px; }
        .cyber-btn:hover { background: linear-gradient(135deg, #2ea043, #3fb950); }
        .tab-btn.active { border-bottom: 2px solid #58a6ff; color: #58a6ff; }
        input, select { background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; padding: 8px; }
    </style>
</head>
<body class="min-h-screen font-sans">
    <nav class="glass-panel p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-white tracking-wider">LUNEXA <span class="text-[#58a6ff]">BOT</span></h1>
            <div class="hidden sm:flex gap-2 ml-8">
                <a href="/cms.html" class="px-3 py-1 rounded hover:bg-[#30363d] text-sm">Kembali ke CMS Netflix</a>
            </div>
        </div>
        <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300">Logout</button>
    </nav>

    <div id="login-screen" class="flex items-center justify-center h-[80vh]">
        <div class="glass-panel p-8 rounded-xl w-full max-w-md text-center">
            <h2 class="text-2xl font-bold text-white mb-6">Admin Login</h2>
            <input type="password" id="admin-key" class="w-full mb-4 text-center" placeholder="Enter Admin Key" onkeypress="if(event.key === 'Enter') login()">
            <button onclick="login()" class="cyber-btn w-full py-2 font-bold">LOGIN</button>
            <p id="login-msg" class="text-red-400 text-sm mt-4"></p>
        </div>
    </div>

    <div id="dashboard" class="hidden max-w-6xl mx-auto p-4 sm:p-6">
        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="glass-panel p-4 rounded-lg text-center">
                <p class="text-sm text-gray-400">Total Users</p>
                <h3 id="stat-users" class="text-3xl font-bold text-[#58a6ff]">-</h3>
            </div>
            <div class="glass-panel p-4 rounded-lg text-center">
                <p class="text-sm text-gray-400">Total Orders</p>
                <h3 id="stat-orders" class="text-3xl font-bold text-green-400">-</h3>
            </div>
            <div class="glass-panel p-4 rounded-lg text-center">
                <p class="text-sm text-gray-400">Total Revenue</p>
                <h3 id="stat-rev" class="text-3xl font-bold text-yellow-400">-</h3>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 border-b border-[#30363d] mb-6">
            <button onclick="switchTab('orders')" id="tab-orders" class="tab-btn active px-4 py-2 text-gray-400 font-medium">Riwayat Transaksi</button>
            <button onclick="switchTab('products')" id="tab-products" class="tab-btn px-4 py-2 text-gray-400 font-medium">Produk Toko 2</button>
        </div>

        <!-- Orders View -->
        <div id="view-orders" class="glass-panel rounded-lg overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-[#21262d] text-gray-300">
                    <tr>
                        <th class="p-3">Ref ID</th>
                        <th class="p-3">User</th>
                        <th class="p-3">Produk</th>
                        <th class="p-3">Total</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Tanggal</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody" class="divide-y divide-[#30363d]">
                </tbody>
            </table>
        </div>

        <!-- Products View -->
        <div id="view-products" class="hidden">
            <div class="flex justify-end mb-4">
                <button onclick="showAddModal()" class="cyber-btn px-4 py-2 text-sm font-bold">+ Tambah Produk</button>
            </div>
            <div class="glass-panel rounded-lg overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-[#21262d] text-gray-300">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Kategori</th>
                            <th class="p-3">Nama Produk</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody" class="divide-y divide-[#30363d]">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="glass-panel p-6 rounded-xl w-full max-w-md">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Tambah Produk Toko 2</h2>
            <input type="hidden" id="prod-id">
            
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-gray-400">ID Kategori (Cth: CAT123)</label>
                    <input type="text" id="prod-cat" class="w-full" placeholder="Kategori ID">
                </div>
                <div>
                    <label class="text-sm text-gray-400">Nama Produk</label>
                    <input type="text" id="prod-name" class="w-full" placeholder="Misal: Netflix 1 Bulan">
                </div>
                <div>
                    <label class="text-sm text-gray-400">Harga (Rp)</label>
                    <input type="number" id="prod-price" class="w-full" placeholder="Misal: 25000">
                </div>
                <div>
                    <label class="text-sm text-gray-400">Data / Akun (Kirim ke user saat beli)</label>
                    <textarea id="prod-data" class="w-full bg-[#0d1117] border border-[#30363d] rounded-md p-2 text-white h-24" placeholder="Email: pass"></textarea>
                </div>
                <div id="div-sold" class="hidden flex items-center gap-2">
                    <input type="checkbox" id="prod-sold">
                    <label class="text-sm text-gray-400">Tandai Terjual (Sold)</label>
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="saveProduct()" class="cyber-btn flex-1 py-2 font-bold">Simpan</button>
                <button onclick="closeModal()" class="bg-[#21262d] hover:bg-[#30363d] text-white flex-1 py-2 rounded-md font-bold">Batal</button>
            </div>
        </div>
    </div>

    <script>
        let CMS_KEY = localStorage.getItem('adm_key') || '';
        const API_BASE = '/api/bot';

        async function login() {
            const key = document.getElementById('admin-key').value;
            if(!key) return;
            document.getElementById('login-msg').textContent = 'Checking...';
            CMS_KEY = key;
            try {
                const res = await fetch(\\/stats\, { headers: { 'X-Admin-Key': CMS_KEY } });
                if(res.ok) {
                    localStorage.setItem('adm_key', CMS_KEY);
                    location.reload();
                } else {
                    document.getElementById('login-msg').textContent = 'Invalid Admin Key';
                    CMS_KEY = '';
                }
            } catch(e) {
                document.getElementById('login-msg').textContent = 'Server Bot Error/Offline. Pastikan port sudah dibuka dan bot menyala.';
            }
        }

        function logout() {
            localStorage.removeItem('adm_key');
            location.reload();
        }

        async function init() {
            if(!CMS_KEY) return;
            try {
                const res = await fetch(\\/stats\, { headers: { 'X-Admin-Key': CMS_KEY } });
                if(!res.ok) throw new Error('Unauthorized');
                const data = await res.json();
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                document.getElementById('stat-users').textContent = data.stats.users;
                document.getElementById('stat-orders').textContent = data.stats.totalOrders;
                document.getElementById('stat-rev').textContent = 'Rp ' + data.stats.revenue.toLocaleString('id-ID');
                
                loadOrders();
                loadProducts();
            } catch(e) {
                document.getElementById('login-msg').textContent = 'Session expired / Bot Offline';
                localStorage.removeItem('adm_key');
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-orders').classList.remove('active');
            document.getElementById('tab-products').classList.remove('active');
            document.getElementById('view-orders').classList.add('hidden');
            document.getElementById('view-products').classList.add('hidden');
            
            document.getElementById(\	ab-\\).classList.add('active');
            document.getElementById(\iew-\\).classList.remove('hidden');
        }

        async function loadOrders() {
            try {
                const res = await fetch(\\/orders\, { headers: { 'X-Admin-Key': CMS_KEY } });
                const data = await res.json();
                const tbody = document.getElementById('orders-tbody');
                tbody.innerHTML = data.orders.map(o => \
                    <tr class="hover:bg-[#21262d]">
                        <td class="p-3 font-mono text-xs text-gray-400">\</td>
                        <td class="p-3">\</td>
                        <td class="p-3 text-[#58a6ff]">\</td>
                        <td class="p-3 font-bold text-green-400">Rp \</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs \">\</span></td>
                        <td class="p-3 text-gray-400">\</td>
                    </tr>
                \).join('');
            } catch(e) {}
        }

        let allProducts = {};
        async function loadProducts() {
            try {
                const res = await fetch(\\/products\, { headers: { 'X-Admin-Key': CMS_KEY } });
                const data = await res.json();
                allProducts = data.items;
                const tbody = document.getElementById('products-tbody');
                tbody.innerHTML = Object.values(data.items).map(p => \
                    <tr class="hover:bg-[#21262d]">
                        <td class="p-3 font-mono text-xs text-gray-400">\</td>
                        <td class="p-3">\</td>
                        <td class="p-3 font-bold">\</td>
                        <td class="p-3 text-green-400">Rp \</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs \">\</span></td>
                        <td class="p-3">
                            <button onclick="editProduct('\')" class="text-[#58a6ff] hover:underline mr-2">Edit</button>
                            <button onclick="deleteProduct('\')" class="text-red-400 hover:underline">Hapus</button>
                        </td>
                    </tr>
                \).join('');
            } catch(e) {}
        }

        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Tambah Produk';
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-cat').value = 'CAT1';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-data').value = '';
            document.getElementById('div-sold').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function editProduct(id) {
            const p = allProducts[id];
            if(!p) return;
            document.getElementById('modal-title').textContent = 'Edit Produk';
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-cat').value = p.catId;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-data').value = p.data;
            document.getElementById('prod-sold').checked = !!p.sold;
            document.getElementById('div-sold').classList.remove('hidden');
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const payload = {
                catId: document.getElementById('prod-cat').value,
                name: document.getElementById('prod-name').value,
                price: document.getElementById('prod-price').value,
                data: document.getElementById('prod-data').value,
                sold: document.getElementById('prod-sold').checked
            };
            
            const endpoint = id ? '/api/bot/products/edit' : '/api/bot/products/add';
            if(id) payload.id = id;

            try {
                await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': CMS_KEY },
                    body: JSON.stringify(payload)
                });
                closeModal();
                loadProducts();
            } catch(e) {
                alert('Gagal menyimpan produk');
            }
        }

        async function deleteProduct(id) {
            if(!confirm('Yakin hapus produk ini?')) return;
            try {
                await fetch('/api/bot/products/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': CMS_KEY },
                    body: JSON.stringify({ id })
                });
                loadProducts();
            } catch(e) {
                alert('Gagal menghapus produk');
            }
        }

        if(CMS_KEY) init();
    </script>
</body>
</html>
